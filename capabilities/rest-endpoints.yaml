naftiko: 1.0.0-alpha2
info:
  label: Apache ServiceMix REST API — Endpoints
  description: 'Apache ServiceMix REST API — Endpoints. 1 operations. Lead operation: Apache ServiceMix List Endpoints. Self-contained
    Naftiko capability covering one Apache Servicemix business surface.'
  tags:
  - Apache Servicemix
  - Endpoints
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APACHE_SERVICEMIX_API_KEY: APACHE_SERVICEMIX_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-endpoints
    baseUri: https://servicemix.example.com/api
    description: Apache ServiceMix REST API — Endpoints business capability. Self-contained, no shared references.
    resources:
    - name: endpoints
      path: /endpoints
      operations:
      - name: listendpoints
        method: GET
        description: Apache ServiceMix List Endpoints
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: rest-endpoints-rest
    port: 8080
    description: REST adapter for Apache ServiceMix REST API — Endpoints. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/endpoints
      name: endpoints
      description: REST surface for endpoints.
      operations:
      - method: GET
        name: listendpoints
        description: Apache ServiceMix List Endpoints
        call: rest-endpoints.listendpoints
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-endpoints-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apache ServiceMix REST API — Endpoints. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: apache-servicemix-list-endpoints
      description: Apache ServiceMix List Endpoints
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-endpoints.listendpoints
      outputParameters:
      - type: object
        mapping: $.
